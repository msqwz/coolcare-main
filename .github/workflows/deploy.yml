name: Deploy CoolCare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd frontend
          npm ci --silent
          npm run build
        env:
          VITE_API_URL: https://plus-cool.ru
          VITE_SUPABASE_URL: https://cdfrzzyfkmaswwtdknle.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkZnJ6enlma21hc3d3dGRrbmxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5NDk5NDQsImV4cCI6MjA4NzUyNTk0NH0.1j272Ad-yLmsBGqnLq-3zgg4VlfSaOsMY7JRJ2Vra44
          VITE_YANDEX_MAPS_API_KEY: e1a186ee-6741-4e3f-b7f4-438ed8c61c4b

      - name: Build Dispatcher
        run: |
          cd dispatcher
          npm ci --silent
          npm run build
        env:
          VITE_API_URL: https://plus-cool.ru
          VITE_SUPABASE_URL: https://cdfrzzyfkmaswwtdknle.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkZnJ6enlma21hc3d3dGRrbmxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5NDk5NDQsImV4cCI6MjA4NzUyNTk0NH0.1j272Ad-yLmsBGqnLq-3zgg4VlfSaOsMY7JRJ2Vra44

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null" > ~/.ssh/config

      - name: Upload builds to server
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key" \
            frontend/dist/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/coolcare/frontend/dist/
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key" \
            dispatcher/dist/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/coolcare/dispatcher/dist/

      - name: Deploy backend & restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/coolcare
            git pull origin main
            source venv/bin/activate
            pip install -r backend/requirements.txt -q
            sudo systemctl restart coolcare
            sudo systemctl reload nginx
            echo "✅ Deploy complete: $(date)"
