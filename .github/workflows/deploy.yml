name: Deploy CoolCare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd frontend
          npm ci --silent
          npm run build
        env:
          VITE_API_URL: https://plus-cool.ru
          VITE_SUPABASE_URL: https://cdfrzzyfkmaswwtdknle.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkZnJ6enlma21hc3d3dGRrbmxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5NDk5NDQsImV4cCI6MjA4NzUyNTk0NH0.1j272Ad-yLmsBGqnLq-3zgg4VlfSaOsMY7JRJ2Vra44
          VITE_YANDEX_MAPS_API_KEY: e1a186ee-6741-4e3f-b7f4-438ed8c61c4b

      - name: Build Dispatcher
        run: |
          cd dispatcher
          npm ci --silent
          npm run build
        env:
          VITE_API_URL: https://plus-cool.ru
          VITE_SUPABASE_URL: https://cdfrzzyfkmaswwtdknle.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkZnJ6enlma21hc3d3dGRrbmxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5NDk5NDQsImV4cCI6MjA4NzUyNTk0NH0.1j272Ad-yLmsBGqnLq-3zgg4VlfSaOsMY7JRJ2Vra44

      - name: ✅ Build successful
        run: echo "Frontend and Dispatcher built successfully. Deploy manually with 'bash deploy.sh' on the server."

  deploy:
    name: Deploy to Server
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            cd /var/www/coolcare
            git pull origin main
            bash deploy.sh
